services:
  nextjs-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: nextjs-sample:dev
    container_name: nextjs-sample-dev
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /src/app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json